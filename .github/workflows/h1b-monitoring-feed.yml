name: Refresh H-1B public-post feed

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan indexed Reddit posts
        run: python h1b-monitoring/update_feed.py
      - name: Publish changed results
        run: |
          if git diff --quiet -- h1b-monitoring/feed.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h1b-monitoring/feed.json
          git commit -m 'Update H-1B monitoring feed'
          git push
